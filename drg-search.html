<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>질병군(DRG) 분류 · 주진단-수술코드 조회</title>
<script src="https://cdnjs.cloudflare.com/ajax/libs/pdf.js/3.11.174/pdf.min.js"></script>
<style>
  :root{
    --navy:#0F2A44;
    --navy-2:#173A5E;
    --teal:#0E7C86;
    --teal-light:#E4F3F3;
    --red:#B93B3B;
    --red-light:#FBEAEA;
    --bg:#F4F6F8;
    --card:#FFFFFF;
    --line:#DFE5EA;
    --text:#1C2733;
    --text-mute:#5B6B78;
    --mono: "SFMono-Regular", Consolas, "Liberation Mono", Menlo, monospace;
  }
  *{box-sizing:border-box;}
  html,body{margin:0;padding:0;}
  body{
    background:var(--bg);
    color:var(--text);
    font-family:"Pretendard","Apple SD Gothic Neo","Malgun Gothic","Noto Sans KR",system-ui,-apple-system,sans-serif;
    line-height:1.55;
  }
  .app{max-width:1180px;margin:0 auto;padding:0 20px 60px;}

  /* Header */
  .topbar{
    background:linear-gradient(135deg,var(--navy) 0%,var(--navy-2) 100%);
    color:#fff;
    padding:26px 20px 22px;
    margin-bottom:0;
  }
  .topbar-inner{max-width:1180px;margin:0 auto;}
  .topbar h1{
    font-size:22px;
    margin:0 0 4px;
    font-weight:700;
    letter-spacing:-0.2px;
  }
  .topbar p{
    margin:0;
    font-size:13.5px;
    color:#C9D8E3;
  }
  .topbar-meta{
    display:flex;gap:8px;margin-top:14px;flex-wrap:wrap;
  }
  .topbar-meta span{
    background:rgba(255,255,255,0.12);
    border:1px solid rgba(255,255,255,0.18);
    padding:4px 10px;
    border-radius:20px;
    font-size:12px;
    color:#EAF1F6;
  }

  /* Tabs */
  .tabs{
    display:flex;
    gap:4px;
    margin:18px 0 22px;
    border-bottom:1px solid var(--line);
    overflow-x:auto;
  }
  .tab-btn{
    appearance:none;border:none;background:none;cursor:pointer;
    padding:11px 16px;
    font-size:14.5px;
    font-weight:600;
    color:var(--text-mute);
    white-space:nowrap;
    border-bottom:2.5px solid transparent;
    transition:color .15s, border-color .15s;
  }
  .tab-btn:hover{color:var(--navy);}
  .tab-btn.active{
    color:var(--navy);
    border-bottom-color:var(--teal);
  }
  .tab-btn .count{
    display:inline-block;margin-left:6px;
    font-size:11px;font-weight:700;
    color:var(--teal);
    background:var(--teal-light);
    padding:1px 6px;border-radius:10px;
  }

  .panel{display:none;}
  .panel.active{display:block;}

  .cat-header{
    display:flex;justify-content:space-between;align-items:flex-end;
    margin-bottom:16px;flex-wrap:wrap;gap:10px;
  }
  .cat-header h2{
    margin:0;font-size:19px;font-weight:700;color:var(--navy);
  }
  .cat-header .sub{
    color:var(--text-mute);font-size:13px;margin-top:3px;
  }

  .section{margin-bottom:26px;}
  .section-title{
    font-size:13px;font-weight:700;color:var(--navy);
    text-transform:uppercase;letter-spacing:0.4px;
    margin:0 0 10px;
    display:flex;align-items:center;gap:8px;
  }
  .section-title .line{flex:1;height:1px;background:var(--line);}

  /* ADRG cards */
  .adrg-grid{
    display:grid;grid-template-columns:repeat(auto-fill,minmax(260px,1fr));
    gap:10px;
  }
  .adrg-card{
    background:var(--card);
    border:1px solid var(--line);
    border-radius:10px;
    padding:12px 14px;
  }
  .adrg-code{
    display:inline-block;
    font-family:var(--mono);
    font-weight:700;
    font-size:13px;
    color:#fff;
    background:var(--navy);
    padding:2px 8px;
    border-radius:6px;
    margin-bottom:6px;
  }
  .adrg-name{font-size:13.5px;font-weight:600;color:var(--text);}
  .adrg-en{font-size:11.5px;color:var(--text-mute);margin-top:2px;font-style:italic;}

  .callout{
    background:var(--teal-light);
    border:1px solid #BFE0E0;
    border-left:4px solid var(--teal);
    border-radius:8px;
    padding:10px 14px;
    font-size:13px;
    color:#0D4E55;
    margin-bottom:14px;
  }
  .callout.warn{
    background:var(--red-light);
    border-color:#EFC6C6;
    border-left-color:var(--red);
    color:#7A2727;
  }

  .restricted-table{
    width:100%;border-collapse:collapse;font-size:13px;margin-bottom:10px;
  }
  .restricted-table th,.restricted-table td{
    text-align:left;padding:7px 10px;border-bottom:1px solid var(--line);
  }
  .restricted-table th{color:var(--text-mute);font-weight:600;font-size:11.5px;text-transform:uppercase;}

  /* Procedure groups */
  .proc-group{
    background:var(--card);
    border:1px solid var(--line);
    border-radius:10px;
    margin-bottom:12px;
    overflow:hidden;
  }
  .proc-group-head{
    display:flex;justify-content:space-between;align-items:center;
    padding:11px 14px;
    background:#FAFBFC;
    border-bottom:1px solid var(--line);
    cursor:pointer;
    user-select:none;
  }
  .proc-group-head h3{margin:0;font-size:13.5px;font-weight:700;color:var(--navy);}
  .proc-group-head .toggle{color:var(--text-mute);font-size:12px;}
  .proc-group-badges{display:flex;gap:4px;flex-wrap:wrap;}
  .proc-group-badges span{
    font-family:var(--mono);font-size:10.5px;font-weight:700;
    background:var(--teal-light);color:var(--teal);
    padding:1px 6px;border-radius:5px;
  }
  .proc-table{width:100%;border-collapse:collapse;font-size:13px;}
  .proc-table th,.proc-table td{
    text-align:left;padding:8px 14px;border-bottom:1px solid var(--line);
  }
  .proc-table th{
    color:var(--text-mute);font-weight:600;font-size:11px;
    text-transform:uppercase;letter-spacing:0.3px;
    background:#fff;
  }
  .proc-table td.code{font-family:var(--mono);color:var(--navy);white-space:nowrap;}
  .proc-table td.qcode{font-family:var(--mono);color:var(--teal);font-weight:700;white-space:nowrap;}
  .proc-table tr:last-child td{border-bottom:none;}
  .proc-empty-note{padding:10px 14px;font-size:12.5px;color:var(--text-mute);font-style:italic;}

  /* Diagnosis search + table */
  .dx-toolbar{
    display:flex;gap:10px;align-items:center;margin-bottom:10px;flex-wrap:wrap;
  }
  .dx-search{
    flex:1;min-width:220px;
    padding:9px 12px;
    border:1px solid var(--line);
    border-radius:8px;
    font-size:13.5px;
    outline:none;
  }
  .dx-search:focus{border-color:var(--teal);}
  .dx-count{font-size:12.5px;color:var(--text-mute);white-space:nowrap;}
  .dx-toggle-label{
    font-size:12.5px;color:var(--text-mute);display:flex;align-items:center;gap:5px;white-space:nowrap;
  }
  .dx-table-wrap{
    max-height:480px;overflow-y:auto;
    border:1px solid var(--line);border-radius:10px;background:var(--card);
  }
  table.dx-table{width:100%;border-collapse:collapse;font-size:13px;}
  table.dx-table thead th{
    position:sticky;top:0;background:#FAFBFC;
    text-align:left;padding:8px 14px;
    border-bottom:1px solid var(--line);
    font-size:11px;color:var(--text-mute);font-weight:700;
    text-transform:uppercase;letter-spacing:0.3px;
    z-index:1;
  }
  table.dx-table td{padding:7px 14px;border-bottom:1px solid #EEF1F3;}
  table.dx-table td.code{font-family:var(--mono);color:var(--navy);white-space:nowrap;font-weight:600;}
  table.dx-table tr:last-child td{border-bottom:none;}
  table.dx-table tr:hover td{background:#F8FAFB;}
  .badge-mal{
    display:inline-block;margin-left:8px;
    font-size:10px;font-weight:700;color:#fff;
    background:var(--red);padding:1px 6px;border-radius:5px;
    vertical-align:middle;
  }
  .badge-custom{
    display:inline-block;margin-left:8px;
    font-size:10px;font-weight:700;color:#fff;
    background:var(--teal);padding:1px 6px;border-radius:5px;
    vertical-align:middle;
  }
  .add-codes-note{
    font-size:12.5px;color:var(--text-mute);margin-top:8px;
  }
  .add-codes-note b{color:var(--navy);}

  /* Data management tab */
  .mgmt-grid{display:grid;grid-template-columns:1.1fr 1fr;gap:18px;}
  @media (max-width:880px){.mgmt-grid{grid-template-columns:1fr;}}
  .mgmt-card{
    background:var(--card);border:1px solid var(--line);border-radius:12px;padding:16px 18px;
  }
  .mgmt-card h3{margin:0 0 6px;font-size:14.5px;color:var(--navy);}
  .mgmt-card p.desc{margin:0 0 12px;font-size:12.5px;color:var(--text-mute);}
  .upload-drop{
    border:2px dashed var(--line);border-radius:10px;
    padding:22px 14px;text-align:center;cursor:pointer;
    transition:border-color .15s, background .15s;
    font-size:13px;color:var(--text-mute);
  }
  .upload-drop:hover{border-color:var(--teal);background:var(--teal-light);}
  .upload-drop input{display:none;}
  .btn{
    appearance:none;border:none;cursor:pointer;
    background:var(--navy);color:#fff;
    font-size:13px;font-weight:600;
    padding:9px 16px;border-radius:8px;
  }
  .btn.secondary{background:var(--teal);}
  .btn.danger{background:var(--red);}
  .btn.ghost{background:none;border:1px solid var(--line);color:var(--text);}
  .btn:disabled{opacity:0.5;cursor:not-allowed;}
  .form-row{display:flex;gap:8px;margin-bottom:8px;flex-wrap:wrap;}
  .form-row select, .form-row input{
    padding:8px 10px;border:1px solid var(--line);border-radius:7px;font-size:13px;
    flex:1;min-width:110px;
  }
  .raw-pre{
    background:#0F2A44;color:#D6E4EC;
    font-family:var(--mono);font-size:11.5px;
    padding:12px;border-radius:8px;
    max-height:260px;overflow:auto;white-space:pre-wrap;word-break:break-all;
    margin-top:10px;
  }
  .custom-list{margin-top:12px;}
  .custom-row{
    display:flex;justify-content:space-between;align-items:center;
    padding:7px 10px;border:1px solid var(--line);border-radius:7px;margin-bottom:6px;
    font-size:12.5px;
  }
  .custom-row .x{color:var(--red);cursor:pointer;font-weight:700;padding:2px 6px;}
  .status-msg{font-size:12.5px;margin-top:8px;}
  .status-msg.ok{color:var(--teal);}
  .status-msg.err{color:var(--red);}
  .footnote{
    margin-top:36px;padding-top:14px;border-top:1px solid var(--line);
    font-size:11.5px;color:var(--text-mute);
  }
</style>
</head>

<div class="topbar">
  <div class="topbar-inner">

</div>

</div>

<script>
(function(){
  "use strict";

  const DATA = JSON.parse(document.getElementById('drg-data').textContent);
  const CAT_ORDER = ["eye","ent","gs","gyn","ob"];
  const STORAGE_PREFIX = "drg-tool:";

  // working copies (base + custom additions)
  const state = {
    custom: {}, // catKey -> { dx:[{code,name,malignant}], proc:[{groupTitle,code,qcode,name}] }
    dxFilter: {}, // catKey -> string
    hideMalignant: {}, // catKey -> bool
    procFilter: {}, // catKey -> string
  };
  CAT_ORDER.forEach(k=>{ state.custom[k] = {dx:[], proc:[]}; state.dxFilter[k]=""; state.hideMalignant[k]=false; state.procFilter[k]=""; });

  function escapeHtml(s){
    return String(s).replace(/[&<>"']/g, c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
  }

  // ---------- storage ----------
  async function loadCustom(){
    for (const k of CAT_ORDER){
      try{
        const res = await window.storage.get(STORAGE_PREFIX+k, false);
        if (res && res.value){
          const parsed = JSON.parse(res.value);
          if (parsed && typeof parsed === 'object'){
            state.custom[k] = { dx: parsed.dx||[], proc: parsed.proc||[] };
          }
        }
      }catch(e){ /* key not found or storage unavailable - ignore */ }
    }
  }

  async function saveCustom(catKey){
    try{
      await window.storage.set(STORAGE_PREFIX+catKey, JSON.stringify(state.custom[catKey]), false);
      return true;
    }catch(e){
      console.error('storage save failed', e);
      return false;
    }
  }

  // ---------- rendering ----------
  function totalCounts(){
    let dx=0, proc=0;
    CAT_ORDER.forEach(k=>{
      dx += DATA[k].dx.length + state.custom[k].dx.length;
      DATA[k].procGroups.forEach(g=> proc += (g.items||[]).length);
      proc += state.custom[k].proc.length;
    });
    return {dx, proc};
  }

  function updateMeta(){
    const {dx, proc} = totalCounts();
    document.getElementById('meta-total-dx').textContent = `주진단 ${dx.toLocaleString()}건`;
    document.getElementById('meta-total-proc').textContent = `시술코드 ${proc.toLocaleString()}건`;
  }

  function buildTabs(){
    const tabsEl = document.getElementById('tabs');
    let html = '';
    CAT_ORDER.forEach((k,i)=>{
      const cat = DATA[k];
      const dxCount = cat.dx.length + state.custom[k].dx.length;
      html += `<button class="tab-btn${i===0?' active':''}" data-tab="${k}">${escapeHtml(cat.title)}<span class="count">${dxCount}</span></button>`;
    });
    html += `<button class="tab-btn" data-tab="mgmt">자료 관리</button>`;
    tabsEl.innerHTML = html;
    tabsEl.querySelectorAll('.tab-btn').forEach(btn=>{
      btn.addEventListener('click', ()=> switchTab(btn.dataset.tab));
    });
  }

  function switchTab(key){
    document.querySelectorAll('.tab-btn').forEach(b=> b.classList.toggle('active', b.dataset.tab===key));
    document.querySelectorAll('.panel').forEach(p=> p.classList.toggle('active', p.id==='panel-'+key));
  }

  function renderAdrgGrid(cat){
    return `<div class="adrg-grid">` + cat.adrg.map(a=>`
      <div class="adrg-card">
        <span class="adrg-code">${escapeHtml(a.code)}</span>
        <div class="adrg-name">${escapeHtml(a.name)}</div>
        ${a.en ? `<div class="adrg-en">${escapeHtml(a.en)}</div>` : ''}
      </div>`).join('') + `</div>`;
  }

  function procMatches(it, filter){
    if (!filter) return true;
    return it.code.toLowerCase().includes(filter) ||
      (it.qcode||'').toLowerCase().includes(filter) ||
      it.name.toLowerCase().includes(filter);
  }

  function countAllProc(catKey, cat){
    let total = 0;
    cat.procGroups.forEach(g=> total += (g.items||[]).length);
    total += state.custom[catKey].proc.length;
    return total;
  }

  function renderProcGroups(catKey, cat){
    const filter = (state.procFilter[catKey]||'').trim().toLowerCase();
    let shown = 0;
    const groupBlocks = cat.procGroups.map((g, gi)=>{
      const badges = (g.adrgs||[]).map(c=>`<span>${escapeHtml(c)}</span>`).join('');
      const items = (g.items || []).filter(it=> procMatches(it, filter));
      const noteMatches = !filter || (g.note && g.note.toLowerCase().includes(filter)) || g.title.toLowerCase().includes(filter);
      shown += items.length;

      // hide this group entirely if a search is active and nothing in it matches
      if (filter && items.length===0 && !(g.note && noteMatches)) return '';

      let body = '';
      if (g.note){
        body += `<div class="proc-empty-note">${escapeHtml(g.note)}</div>`;
      }
      if (items.length){
        body += `<table class="proc-table"><thead><tr><th>구분코드</th><th>청구코드</th><th>명칭</th></tr></thead><tbody>` +
          items.map(it=>`<tr><td class="code">${escapeHtml(it.code)}</td><td class="qcode">${escapeHtml(it.qcode)}</td><td>${escapeHtml(it.name)}</td></tr>`).join('') +
          `</tbody></table>`;
      } else if (!g.note){
        body += `<div class="proc-empty-note">등록된 시술 코드가 없습니다.</div>`;
      }
      return `<div class="proc-group" data-group="${catKey}-${gi}">
        <div class="proc-group-head" data-toggle="${catKey}-${gi}">
          <h3>${escapeHtml(g.title)}</h3>
          <div class="proc-group-badges">${badges}</div>
        </div>
        <div class="proc-group-body">${body}</div>
      </div>`;
    }).filter(Boolean);

    // custom procedures added by user
    const custom = state.custom[catKey].proc.filter(it=> procMatches(it, filter));
    shown += custom.length;
    let customBlock = '';
    if (state.custom[catKey].proc.length && (custom.length || !filter)){
      customBlock = `<div class="proc-group">
        <div class="proc-group-head"><h3>사용자 추가 시술 <span class="badge-custom">추가됨</span></h3></div>
        <div class="proc-group-body"><table class="proc-table"><thead><tr><th>구분코드</th><th>청구코드</th><th>명칭</th><th></th></tr></thead><tbody>` +
        custom.map((it)=>{
          const idx = state.custom[catKey].proc.indexOf(it);
          return `<tr><td class="code">${escapeHtml(it.code)}</td><td class="qcode">${escapeHtml(it.qcode||'')}</td><td>${escapeHtml(it.name)}</td>
          <td><span class="x" data-del-proc="${catKey}:${idx}" style="color:var(--red);cursor:pointer;font-weight:700;">삭제</span></td></tr>`;
        }).join('') +
        `</tbody></table></div></div>`;
    }

    let html;
    if (groupBlocks.length===0 && !customBlock){
      html = `<div class="proc-empty-note" style="padding:16px;text-align:center;">검색 결과가 없습니다.</div>`;
    } else {
      html = groupBlocks.join('') + customBlock;
    }

    return {html, shown};
  }

  function allDx(catKey, cat){
    const base = cat.dx.map(d=>({code:d.code, name:d.name, malignant: !!d.malignant, custom:false}));
    const custom = state.custom[catKey].dx.map(d=>({code:d.code, name:d.name, malignant: !!d.malignant, custom:true}));
    return base.concat(custom);
  }

  function renderDxTable(catKey, cat){
    const list = allDx(catKey, cat);
    const filter = (state.dxFilter[catKey]||'').trim().toLowerCase();
    const hideMal = state.hideMalignant[catKey];
    const filtered = list.filter(d=>{
      if (hideMal && d.malignant) return false;
      if (!filter) return true;
      return d.code.toLowerCase().includes(filter) || d.name.toLowerCase().includes(filter);
    });
    const rows = filtered.map(d=>`<tr>
      <td class="code">${escapeHtml(d.code)}</td>
      <td>${escapeHtml(d.name)}${d.malignant?'<span class="badge-mal">악성종양·제외</span>':''}${d.custom?'<span class="badge-custom">추가</span>':''}</td>
    </tr>`).join('');
    return {rowsHtml: rows || `<tr><td colspan="2" style="color:var(--text-mute);padding:16px;">검색 결과가 없습니다.</td></tr>`, shown: filtered.length, total: list.length};
  }

  function hasMalignantFlags(cat){
    return cat.dx.some(d=>d.malignant);
  }

  function renderCategoryPanel(catKey){
    const cat = DATA[catKey];
    const dxRes = renderDxTable(catKey, cat);
    const showMalToggle = hasMalignantFlags(cat);
    const procRes = renderProcGroups(catKey, cat);
    const procTotal = countAllProc(catKey, cat);

    let restrictedHtml = '';
    if (cat.restrictedDx && cat.restrictedDx.length){
      restrictedHtml = `<div class="callout warn">
        <b>주의:</b> ${escapeHtml(cat.dxNote)}
      </div>
      <table class="restricted-table">
        <thead><tr><th>코드</th><th>명칭</th><th>해당 질병군</th></tr></thead>
        <tbody>${cat.restrictedDx.map(r=>`<tr><td class="code" style="font-family:var(--mono);color:var(--navy)">${escapeHtml(r.code)}</td><td>${escapeHtml(r.name)}</td><td>${r.adrgs.map(a=>`<span style="font-family:var(--mono);font-size:11px;background:var(--red-light);color:var(--red);padding:1px 6px;border-radius:5px;margin-right:3px;">${escapeHtml(a)}</span>`).join('')}</td></tr>`).join('')}</tbody>
      </table>`;
    } else if (cat.dxNote){
      restrictedHtml = `<div class="callout">${escapeHtml(cat.dxNote)}</div>`;
    }

    const addCodesHtml = (cat.addCodes && cat.addCodes.length)
      ? `<div class="add-codes-note"><b>부가코드:</b> ${cat.addCodes.map(escapeHtml).join(' · ')}</div>`
      : '';

    return `
      <div class="cat-header">
        <div>
          <h2>${escapeHtml(cat.title)}</h2>
          <div class="sub">${escapeHtml(cat.subtitle||'')}</div>
        </div>
      </div>

      <div class="section">
        <div class="section-title">질병군(ADRG) 분류<div class="line"></div></div>
        ${renderAdrgGrid(cat)}
        ${addCodesHtml}
      </div>

      <div class="section">
        <div class="section-title">해당 외과계 시술<div class="line"></div></div>
        <div class="dx-toolbar">
          <input type="text" class="dx-search" placeholder="코드 또는 시술명 검색 (예: Q2862, 치핵)" data-procsearch="${catKey}" value="${escapeHtml(state.procFilter[catKey]||'')}">
          <span class="dx-count" data-proccount="${catKey}">${procRes.shown.toLocaleString()} / ${procTotal.toLocaleString()}건</span>
        </div>
        <div data-procbody="${catKey}">${procRes.html}</div>
      </div>

      <div class="section">
        <div class="section-title">주진단 목록<div class="line"></div></div>
        ${restrictedHtml}
        <div class="dx-toolbar">
          <input type="text" class="dx-search" placeholder="코드 또는 진단명 검색 (예: H26, 백내장)" data-search="${catKey}" value="${escapeHtml(state.dxFilter[catKey]||'')}">
          ${showMalToggle ? `<label class="dx-toggle-label"><input type="checkbox" data-hidemal="${catKey}" ${state.hideMalignant[catKey]?'checked':''}> 악성종양(제외 대상) 숨기기</label>` : ''}
          <span class="dx-count" data-count="${catKey}">${dxRes.shown.toLocaleString()} / ${dxRes.total.toLocaleString()}건</span>
        </div>
        <div class="dx-table-wrap">
          <table class="dx-table">
            <thead><tr><th style="width:120px;">코드</th><th>진단명</th></tr></thead>
            <tbody data-dxbody="${catKey}">${dxRes.rowsHtml}</tbody>
          </table>
        </div>
      </div>
    `;
  }

  function renderMgmtPanel(){
    const options = CAT_ORDER.map(k=>`<option value="${k}">${escapeHtml(DATA[k].title)}</option>`).join('');
    return `
      <div class="cat-header">
        <div>
          <h2>자료 관리</h2>
          <div class="sub">PDF 원문 업로드로 최신 고시 확인 · 주진단/시술 코드 직접 추가</div>
        </div>
      </div>

      <div class="mgmt-grid">
        <div class="mgmt-card">
          <h3>PDF 문서 업로드 (개정판 확인)</h3>
          <p class="desc">개정된 「질병군범주의 결정 및 그 분류번호」 PDF를 업로드하면 텍스트를 추출해 아래에 표시합니다. 추출된 내용을 확인한 뒤, 변경된 항목을 오른쪽 폼으로 직접 추가/수정하세요.</p>
          <label class="upload-drop" id="drop-zone">
            <div>📄 클릭하거나 PDF 파일을 이곳에 끌어다 놓으세요</div>
            <input type="file" id="pdf-input" accept="application/pdf">
          </label>
          <div id="pdf-status" class="status-msg"></div>
          <pre class="raw-pre" id="pdf-raw" style="display:none;"></pre>
        </div>

        <div class="mgmt-card">
          <h3>항목 직접 추가</h3>
          <p class="desc">개정 고시 등에서 새로 확인한 주진단 또는 시술 코드를 카테고리에 추가합니다. 추가한 항목은 이 브라우저 계정에 저장되어 다음에 다시 열어도 유지됩니다.</p>
          <div class="form-row">
            <select id="add-cat">${options}</select>
            <select id="add-type">
              <option value="dx">주진단</option>
              <option value="proc">시술(수술) 코드</option>
            </select>
          </div>
          <div class="form-row">
            <input type="text" id="add-code" placeholder="코드 (예: K353 또는 자286가)">
            <input type="text" id="add-qcode" placeholder="청구코드 (시술인 경우, 예: Q2862)">
          </div>
          <div class="form-row">
            <input type="text" id="add-name" placeholder="명칭" style="flex:2;">
          </div>
          <div class="form-row">
            <label style="font-size:12.5px;color:var(--text-mute);display:flex;align-items:center;gap:5px;">
              <input type="checkbox" id="add-malignant"> 악성종양(제외 대상) 표시 (여성생식기계 등)
            </label>
          </div>
          <button class="btn secondary" id="add-btn">추가하기</button>
          <div id="add-status" class="status-msg"></div>

          <div class="custom-list" id="custom-list"></div>
        </div>
      </div>
    `;
  }

  function renderCustomList(){
    const el = document.getElementById('custom-list');
    if (!el) return;
    let html = '';
    CAT_ORDER.forEach(k=>{
      const c = state.custom[k];
      c.dx.forEach((d, idx)=>{
        html += `<div class="custom-row"><span>[${escapeHtml(DATA[k].title)} · 주진단] <b>${escapeHtml(d.code)}</b> ${escapeHtml(d.name)}</span><span class="x" data-del-dx="${k}:${idx}">삭제</span></div>`;
      });
      c.proc.forEach((p, idx)=>{
        html += `<div class="custom-row"><span>[${escapeHtml(DATA[k].title)} · 시술] <b>${escapeHtml(p.code)}</b> ${escapeHtml(p.qcode||'')} ${escapeHtml(p.name)}</span><span class="x" data-del-proc2="${k}:${idx}">삭제</span></div>`;
      });
    });
    el.innerHTML = html || `<div style="font-size:12.5px;color:var(--text-mute);">아직 추가된 항목이 없습니다.</div>`;
  }

  function renderAll(){
    const panelsEl = document.getElementById('panels');
    let html = '';
    CAT_ORDER.forEach((k,i)=>{
      html += `<div class="panel${i===0?' active':''}" id="panel-${k}">${renderCategoryPanel(k)}</div>`;
    });
    html += `<div class="panel" id="panel-mgmt">${renderMgmtPanel()}</div>`;
    panelsEl.innerHTML = html;
    attachPanelEvents();
    renderCustomList();
    updateMeta();
  }

  function refreshDxTable(catKey){
    const cat = DATA[catKey];
    const res = renderDxTable(catKey, cat);
    const body = document.querySelector(`[data-dxbody="${catKey}"]`);
    if (body) body.innerHTML = res.rowsHtml;
    const countEl = document.querySelector(`[data-count="${catKey}"]`);
    if (countEl) countEl.textContent = `${res.shown.toLocaleString()} / ${res.total.toLocaleString()}건`;
  }

  function refreshProcTable(catKey){
    const cat = DATA[catKey];
    const res = renderProcGroups(catKey, cat);
    const total = countAllProc(catKey, cat);
    const body = document.querySelector(`[data-procbody="${catKey}"]`);
    if (body){
      body.innerHTML = res.html;
      attachProcGroupEvents(body);
    }
    const countEl = document.querySelector(`[data-proccount="${catKey}"]`);
    if (countEl) countEl.textContent = `${res.shown.toLocaleString()} / ${total.toLocaleString()}건`;
  }

  function attachProcGroupEvents(root){
    root.querySelectorAll('.proc-group-head[data-toggle]').forEach(head=>{
      head.addEventListener('click', ()=>{
        const body = head.nextElementSibling;
        if (body.style.display === 'none'){ body.style.display=''; }
        else { body.style.display='none'; }
      });
    });
    root.querySelectorAll('[data-del-proc]').forEach(x=>{
      x.addEventListener('click', async (e)=>{
        const [cat, idx] = e.target.dataset.delProc.split(':');
        state.custom[cat].proc.splice(Number(idx),1);
        await saveCustom(cat);
        buildTabs();
        refreshProcTable(cat);
      });
    });
  }

  function attachPanelEvents(){
    document.querySelectorAll('[data-search]').forEach(inp=>{
      inp.addEventListener('input', (e)=>{
        const k = e.target.dataset.search;
        state.dxFilter[k] = e.target.value;
        refreshDxTable(k);
      });
    });
    document.querySelectorAll('[data-hidemal]').forEach(chk=>{
      chk.addEventListener('change', (e)=>{
        const k = e.target.dataset.hidemal;
        state.hideMalignant[k] = e.target.checked;
        refreshDxTable(k);
      });
    });
    document.querySelectorAll('[data-procsearch]').forEach(inp=>{
      inp.addEventListener('input', (e)=>{
        const k = e.target.dataset.procsearch;
        state.procFilter[k] = e.target.value;
        refreshProcTable(k);
      });
    });
    document.querySelectorAll('[data-procbody]').forEach(root=> attachProcGroupEvents(root));
  }

  // ---------- add-item form (management tab, delegated because panel re-renders) ----------
  document.addEventListener('click', async (e)=>{
    if (e.target && e.target.id === 'add-btn'){
      const cat = document.getElementById('add-cat').value;
      const type = document.getElementById('add-type').value;
      const code = document.getElementById('add-code').value.trim();
      const qcode = document.getElementById('add-qcode').value.trim();
      const name = document.getElementById('add-name').value.trim();
      const malignant = document.getElementById('add-malignant').checked;
      const statusEl = document.getElementById('add-status');
      if (!code || !name){
        statusEl.textContent = '코드와 명칭을 모두 입력해 주세요.';
        statusEl.className = 'status-msg err';
        return;
      }
      if (type === 'dx'){
        state.custom[cat].dx.push({code, name, malignant});
      } else {
        state.custom[cat].proc.push({code, qcode, name});
      }
      const ok = await saveCustom(cat);
      statusEl.textContent = ok ? '추가되었습니다.' : '저장에 실패했습니다. (브라우저 저장소를 사용할 수 없는 환경일 수 있습니다)';
      statusEl.className = ok ? 'status-msg ok' : 'status-msg err';
      document.getElementById('add-code').value='';
      document.getElementById('add-qcode').value='';
      document.getElementById('add-name').value='';
      document.getElementById('add-malignant').checked=false;
      buildTabs();
      renderAll();
      switchTab('mgmt');
    }
    if (e.target && e.target.dataset && e.target.dataset.delDx){
      const [cat, idx] = e.target.dataset.delDx.split(':');
      state.custom[cat].dx.splice(Number(idx),1);
      await saveCustom(cat);
      buildTabs();
      renderAll();
      switchTab('mgmt');
    }
    if (e.target && e.target.dataset && e.target.dataset.delProc2){
      const [cat, idx] = e.target.dataset.delProc2.split(':');
      state.custom[cat].proc.splice(Number(idx),1);
      await saveCustom(cat);
      buildTabs();
      renderAll();
      switchTab('mgmt');
    }
  });

  // ---------- PDF upload ----------
  function setupPdfUpload(){
    document.addEventListener('change', (e)=>{
      if (e.target && e.target.id === 'pdf-input'){
        const file = e.target.files[0];
        if (file) handlePdfFile(file);
      }
    });
    document.addEventListener('dragover', (e)=>{
      if (e.target && e.target.closest && e.target.closest('#drop-zone')) e.preventDefault();
    });
    document.addEventListener('drop', (e)=>{
      const dz = e.target.closest && e.target.closest('#drop-zone');
      if (dz){
        e.preventDefault();
        const file = e.dataTransfer.files[0];
        if (file) handlePdfFile(file);
      }
    });
  }

  async function handlePdfFile(file){
    const statusEl = document.getElementById('pdf-status');
    const rawEl = document.getElementById('pdf-raw');
    if (!file || file.type !== 'application/pdf'){
      statusEl.textContent = 'PDF 파일만 업로드할 수 있습니다.';
      statusEl.className = 'status-msg err';
      return;
    }
    statusEl.textContent = `"${file.name}" 텍스트 추출 중...`;
    statusEl.className = 'status-msg';
    try{
      if (window.pdfjsLib){
        window.pdfjsLib.GlobalWorkerOptions.workerSrc = 'https://cdnjs.cloudflare.com/ajax/libs/pdf.js/3.11.174/pdf.worker.min.js';
      }
      const buf = await file.arrayBuffer();
      const pdf = await window.pdfjsLib.getDocument({data: buf}).promise;
      let fullText = '';
      for (let p=1; p<=pdf.numPages; p++){
        const page = await pdf.getPage(p);
        const content = await page.getTextContent();
        const strs = content.items.map(it=>it.str);
        fullText += strs.join(' ') + '\n\n--- ' + p + ' / ' + pdf.numPages + ' 페이지 끝 ---\n\n';
      }
      rawEl.style.display = 'block';
      rawEl.textContent = fullText;
      statusEl.textContent = `추출 완료 (${pdf.numPages}페이지). 아래 원문을 확인한 뒤, 변경된 항목은 오른쪽 폼에서 직접 추가하세요.`;
      statusEl.className = 'status-msg ok';
    }catch(err){
      console.error(err);
      statusEl.textContent = '텍스트 추출에 실패했습니다: ' + (err && err.message ? err.message : String(err));
      statusEl.className = 'status-msg err';
    }
  }

  // ---------- init ----------
  async function init(){
    await loadCustom();
    buildTabs();
    renderAll();
    setupPdfUpload();
  }

  init();
})();
</script>
</body>
</html>
